name: GdUnit4 CI
run-name: ${{ github.head_ref || github.ref_name }}-GdUnit4-CI

on:
  push:

  pull_request:
    branches:
      - main

  workflow_dispatch:


concurrency:
  group: gdunit4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  unit-test:
    name: "CI Unit Test"
    runs-on: ubuntu-latest
    timeout-minutes: 10 # The overall timeout
    permissions:
      actions: write
      checks: write
      contents: write
      pull-requests: write
      statuses: write

    steps:
      # checkout your repository
      - uses: actions/checkout@v4
        with:
          lfs: true
      # run tests by using the gdUnit4-action with Godot version 4.2.1 and the latest GdUnit4 release 
      - uses: godot-gdunit-labs/gdUnit4-action@v1.4.2
        with:
          godot-version: '4.7.2'
          paths: |
            res://tests/
          timeout: 5
          report-name: test_report.xml   
